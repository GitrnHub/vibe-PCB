<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 690" role="img" aria-labelledby="t d"><title id="t">vibe-EPD electronics architecture</title><desc id="d">Connectivity, ESP32-S3, power, E-Paper high-voltage interface, 24-pin panel and firmware services.</desc><rect width="1280" height="690" fill="#0c1016"/><g font-family="system-ui, sans-serif"><text x="70" y="70" fill="#e8ecf1" font-size="32" font-weight="700">Electronics + firmware architecture</text><g fill="#171d25" stroke="#4f5966" stroke-width="2"><rect x="70" y="145" width="245" height="120" rx="18"/><rect x="390" y="125" width="310" height="160" rx="18"/><rect x="780" y="145" width="250" height="120" rx="18"/><rect x="1080" y="145" width="130" height="120" rx="18"/><rect x="390" y="370" width="310" height="125" rx="18"/><rect x="780" y="365" width="250" height="135" rx="18"/></g><g fill="#e6ebf1"><text x="98" y="183" font-size="20" font-weight="600">Wi-Fi / BLE / USB</text><text x="98" y="217" font-size="16">Content · provisioning</text><text x="98" y="242" font-size="16">Firmware download / logs</text><text x="425" y="174" font-size="22" font-weight="700">ESP32-S3-WROOM-1</text><text x="425" y="209" font-size="16">network stack · scheduler</text><text x="425" y="236" font-size="16">framebuffer · panel profile</text><text x="425" y="263" font-size="16">sleep / wake policy</text><text x="812" y="183" font-size="20" font-weight="600">EPD interface</text><text x="812" y="217" font-size="16">SPI + BUSY/RST/DC/CS</text><text x="812" y="242" font-size="16">HV rails + RESE select</text><text x="1098" y="184" font-size="20" font-weight="600">Panel</text><text x="1098" y="218" font-size="15">24-pin</text><text x="1098" y="242" font-size="15">0.5 mm</text><text x="425" y="413" font-size="20" font-weight="600">Power</text><text x="425" y="446" font-size="16">5 V input → 3.3 V logic</text><text x="425" y="472" font-size="16">panel-specific HV support</text><text x="812" y="407" font-size="20" font-weight="600">Product services</text><text x="812" y="439" font-size="16">Web UI / OTA / cache</text><text x="812" y="466" font-size="16">partial refresh profiles</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8c98a7"/></marker></defs><g stroke="#8c98a7" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M315 205H390"/><path d="M700 205H780"/><path d="M1030 205H1080"/><path d="M545 370V285"/><path d="M700 430H780"/></g><g transform="translate(70 560)"><rect width="1140" height="70" rx="14" fill="#151b22" stroke="#3f4853"/><text x="28" y="30" fill="#dbe1e8" font-size="16">Boundary: current v0.15 PCB exposes native USB signals on J1; USB-C, charger, battery fuel gauge and RTC are roadmap items.</text><text x="28" y="54" fill="#8f98a4" font-size="14">Released manufacturing data and future integrated product features are shown separately.</text></g></g></svg>