<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">E-Paper compatibility boundary</title><desc id="d">Compatibility categories for 4.2 inch reference, 24 pin monochrome, 24 pin color and 50 pin Spectra 6 panels.</desc><rect width="1280" height="720" fill="#0c1016"/><g font-family="system-ui, sans-serif"><text x="70" y="70" fill="#e8ecf1" font-size="32" font-weight="700">Display compatibility boundary</text><text x="70" y="104" fill="#9199a6" font-size="17">Connector count is not a compatibility guarantee — controller, pinout, RESE and waveform still matter.</text><g transform="translate(70 155)"><g><rect width="530" height="210" rx="20" fill="#14231c" stroke="#39634e"/><text x="28" y="44" fill="#aee0c7" font-size="15">REFERENCE</text><text x="28" y="83" fill="#edf1f5" font-size="25" font-weight="700">4.2-inch GDEY042T81 class</text><text x="28" y="121" fill="#b7c0ca" font-size="17">400 × 300 · 91 × 77 mm · SSD1683</text><text x="28" y="154" fill="#b7c0ca" font-size="17">24-pin / 0.5 mm / SPI</text><text x="28" y="187" fill="#8fa698" font-size="14">Mechanical enclosure v0.1 is built around this class.</text></g><g transform="translate(570 0)"><rect width="570" height="210" rx="20" fill="#141b23" stroke="#414c58"/><text x="28" y="44" fill="#a9b4c0" font-size="15">TARGET FAMILY</text><text x="28" y="83" fill="#edf1f5" font-size="25" font-weight="700">Other 24-pin mono panels</text><text x="28" y="121" fill="#b7c0ca" font-size="17">Electrical family target, not blind plug-and-play</text><text x="28" y="154" fill="#b7c0ca" font-size="17">Verify pinout · controller · RESE · LUT/waveform</text></g><g transform="translate(0 245)"><rect width="530" height="210" rx="20" fill="#211d14" stroke="#665730"/><text x="28" y="44" fill="#e0c87e" font-size="15">CONDITIONAL</text><text x="28" y="83" fill="#edf1f5" font-size="25" font-weight="700">24-pin tri / four-color</text><text x="28" y="121" fill="#b7c0ca" font-size="17">May share connector mechanics but needs exact</text><text x="28" y="154" fill="#b7c0ca" font-size="17">controller profile and panel-specific refresh logic.</text></g><g transform="translate(570 245)"><rect width="570" height="210" rx="20" fill="#231717" stroke="#6a3939"/><text x="28" y="44" fill="#e0a1a1" font-size="15">NOT DIRECT</text><text x="28" y="83" fill="#edf1f5" font-size="25" font-weight="700">50-pin Spectra 6 class</text><text x="28" y="121" fill="#b7c0ca" font-size="17">Different connector / power-interface requirements.</text><text x="28" y="154" fill="#b7c0ca" font-size="17">Use a dedicated adapter or a new hardware revision.</text></g></g><text x="70" y="660" fill="#8f98a5" font-size="14">The site distinguishes reference, family target, conditional and not direct.</text></g></svg>