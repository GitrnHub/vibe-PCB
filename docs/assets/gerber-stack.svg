<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Gerber manufacturing layer stack</title><desc id="d">Exploded manufacturing layer stack showing silkscreen, solder mask, copper, substrate, bottom copper, bottom mask, edge cuts and drill data.</desc><rect width="1280" height="720" fill="#0c1016"/><g font-family="system-ui, sans-serif"><text x="70" y="70" fill="#e8ecf1" font-size="32" font-weight="700">Gerber / drill stack</text><text x="70" y="103" fill="#9199a6" font-size="17">What the board house actually sees</text><g transform="translate(170 150) skewX(-18)"><g><rect width="610" height="62" rx="7" fill="#f2f2ef"/><text x="25" y="39" fill="#20252b" font-size="20" transform="skewX(18)">F.SilkS</text></g><g transform="translate(35 72)"><rect width="610" height="62" rx="7" fill="#304d3d"/><text x="25" y="39" fill="#e7ebf0" font-size="20" transform="skewX(18)">F.Mask</text></g><g transform="translate(70 144)"><rect width="610" height="62" rx="7" fill="#b88c31"/><text x="25" y="39" fill="#18130a" font-size="20" transform="skewX(18)">F.Cu</text></g><g transform="translate(105 216)"><rect width="610" height="86" rx="7" fill="#8d7957"/><text x="25" y="52" fill="#f2eee7" font-size="20" transform="skewX(18)">FR-4 substrate</text></g><g transform="translate(140 312)"><rect width="610" height="62" rx="7" fill="#a47728"/><text x="25" y="39" fill="#18130a" font-size="20" transform="skewX(18)">B.Cu</text></g><g transform="translate(175 384)"><rect width="610" height="62" rx="7" fill="#263d31"/><text x="25" y="39" fill="#e7ebf0" font-size="20" transform="skewX(18)">B.Mask</text></g></g><g transform="translate(900 190)"><rect width="270" height="250" rx="18" fill="#141a22" stroke="#424c58"/><text x="24" y="40" fill="#e7ebf0" font-size="18" font-weight="700">Separate fabrication data</text><text x="24" y="79" fill="#a8b1bc" font-size="16">• Edge.Cuts / outline</text><text x="24" y="112" fill="#a8b1bc" font-size="16">• F.Paste stencil</text><text x="24" y="145" fill="#a8b1bc" font-size="16">• PTH drill</text><text x="24" y="178" fill="#a8b1bc" font-size="16">• NPTH drill</text><text x="24" y="218" fill="#d8bd60" font-size="14">Upload the Gerber ZIP,</text><text x="24" y="239" fill="#d8bd60" font-size="14">not the whole repository.</text></g><text x="70" y="675" fill="#8f98a5" font-size="14">Editable references and manufacturing outputs are kept separate to reduce ordering mistakes.</text></g></svg>